name: Refrescar tokens VOD

on:
  schedule:
    - cron: "0 6,12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    concurrency:
      group: vod-tok
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refrescar tokens VOD
        env:
          MAG_MAC: ${{ secrets.MAG_MAC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python refresh_vod_tokens.py

  publish:
    needs: refresh
    if: always()
    concurrency:
      group: pages-pub
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
