name: Generar EPG XMLTV

on:
  schedule:
    - cron: "15 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    concurrency:
      group: epg-gen
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar EPG para todos los portales
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for dir in portals/*/; do
            if [ -f "${dir}config.json" ]; then
              echo "[+] Generando EPG para ${dir}..."
              PORTAL_CONFIG_PATH="${dir}config.json" python epg.py || echo "EPG parcial o fallido para ${dir} (continuamos)"
            fi
          done

      - name: Publicar cambios finales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portals/ || true
          git diff --cached --quiet || git commit -m "Actualizar EPG ($(date -u +'%F %R UTC'))"
          for i in 1 2 3 4 5 6; do git push && exit 0 || (git pull --rebase -X theirs origin main; sleep 3); done; exit 1

  publish:
    needs: generate
    if: always()
    concurrency:
      group: pages-pub
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
